  <path d="M156,100 C160,118 158,136 150,148" fill="none" stroke="#2E1A52" stroke-width="10" stroke-linecap="round"/>
  <!-- face -->
  <path d="M108,110 Q120,118 132,110" stroke="#2E1A52" stroke-width="3" fill="none" stroke-linecap="round"/>


  <g transform="translate(184,184)">
    <circle r="24" fill="#F3BD02"/>
