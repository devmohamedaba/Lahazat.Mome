      <stop offset="0%" stop-color="#8A5AD8"/>
      <stop offset="100%" stop-color="#5527A4"/>
    </linearGradient>
  </defs>
  <circle cx="120" cy="120" r="118" fill="url(#bg)"/>
  <circle cx="120" cy="120" r="118" fill="none" stroke="white" stroke-width="4" opacity="0.25"/>

  
  <!-- shoulders / blouse -->
  <path d="M120,150 C90,150 68,178 62,214 C58,236 78,246 120,246 C162,246 182,236 178,214 C172,178 150,150 120,150 Z" fill="#5527A4"/>
  <!-- collar -->
